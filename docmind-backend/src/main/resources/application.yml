spring:
  application:
    name: docmind-backend

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  ai:
    mcp:
      server:
        name: docmind-mcp-server
        version: 0.1.0
        protocol: STREAMABLE
        instructions: "Provides structured document lookup (search_documents) to complement DocMind's semantic search."

server:
  port: ${SERVER_PORT:8080}

docmind:
  gemini:
    api-key: ${GEMINI_API_KEY}
    embedding-model: gemini-embedding-001
    embedding-dimension: 768
    generation-model: gemini-3.5-flash-lite
    base-url: https://generativelanguage.googleapis.com
  pinecone:
    api-key: ${PINECONE_API_KEY}
    index-host: ${PINECONE_INDEX_HOST}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

logging:
  level:
    com.docmind: DEBUG
